<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>競艇予想ツール</title>
  <meta name="description" content="出走表・直前情報・オッズをリアルタイムに近い形で反映するボートレース予想ツール" />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f1626" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="競艇予想" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🚤 競艇予想ツール</h1>
    <div class="header-controls">
      <input type="date" id="date-input" />
      <button id="sample-toggle" class="ghost-btn" type="button">サンプルデータ表示</button>
      <span id="status-badge" class="status-badge">読込中…</span>
    </div>
  </header>

  <main>
    <section id="stadium-list" class="panel">
      <h2>開催場</h2>
      <div id="stadium-grid" class="stadium-grid"></div>
    </section>

    <section id="race-list" class="panel hidden">
      <div class="panel-header">
        <button id="back-to-stadiums" class="ghost-btn" type="button">← 開催場一覧</button>
        <h2 id="race-list-title"></h2>
      </div>
      <div id="race-grid" class="race-grid"></div>
    </section>

    <section id="race-detail" class="panel hidden">
      <div class="panel-header">
        <button id="back-to-races" class="ghost-btn" type="button">← レース一覧</button>
        <h2 id="race-detail-title"></h2>
      </div>
      <div id="race-meta" class="race-meta"></div>
      <div id="weather-box" class="weather-box"></div>
      <div id="racer-table-wrap"></div>
      <div id="trifecta-box"></div>
      <div id="result-box"></div>
    </section>
  </main>

  <footer class="app-footer">
    <p>
      ※本ツールの予想は参考情報です。的中や利益を保証するものではありません。舟券の購入は自己責任で行ってください。<br />
      データ提供: <a href="https://github.com/turnmark/api" target="_blank" rel="noopener">Turnmark Boatrace Open API</a>（非公式・約3分間隔で更新）<br />
      このページはホーム画面に追加するとアプリのように起動できます。
    </p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>

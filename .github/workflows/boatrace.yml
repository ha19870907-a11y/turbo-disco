name: ボートレース予想の更新
# 当日の更新は loop モードの1本のジョブが10分ごとに行い、ジョブの上限時間の手前で次の loop を
# 起動して22時（日本時間）まで引き継ぐ。GitHub の定期実行は朝の起動と翌日分の前日予想にだけ使う。
# 定期実行が動かない日は、Actions 画面から mode=loop で手動実行すれば同じように動く。
on:
  schedule:
    - cron: "20 22 * * *"   # 7:20 JST 当日の前日予想を作り直して loop を始める
    - cron: "10 9 * * *"    # 18:10 JST 翌日の前日予想（loop が動いている間は終わるまで待つ）
  workflow_dispatch:
    inputs:
      mode:
        description: "loop（22時まで10分ごとに更新）/ live（1回だけ更新）/ prep（当日の前日予想）/ prep-tomorrow（翌日の前日予想）"
        default: loop
        type: choice
        options: [loop, live, prep, prep-tomorrow]
      date:
        description: "対象日 YYYYMMDD（live / prep のみ。空なら今日）"
        required: false
permissions:
  contents: write
  actions: write   # loop が次の loop を起動するため
concurrency:
  group: boatrace
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r boatrace/requirements.txt
      - name: 予想データを作成して公開
        env:
          BOATRACE_PASSWORD: ${{ secrets.BOATRACE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          DATE: ${{ inputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          case "$SCHEDULE" in
            "20 22 * * *") bash boatrace/run.sh loop ;;
            "10 9 * * *") bash boatrace/run.sh prep-tomorrow ;;
            *) bash boatrace/run.sh "${MODE:-loop}" ;;
          esac

name: ボートレース予想の更新
on:
  schedule:
    - cron: "20 22 * * *"          # 7:20 JST 当日の前日予想を作り直す（欠場などを反映）
    - cron: "10 9 * * *"           # 18:10 JST 翌日の前日予想
    - cron: "40 12 * * *"          # 21:40 JST 翌日の前日予想（出走表の更新分）
    - cron: "*/10 23,0-12 * * *"   # 8:00〜21:59 JST 10分ごとに展示・オッズ・結果を反映
  workflow_dispatch:
    inputs:
      mode:
        description: "prep（前日予想）/ live（直前更新）"
        default: live
        type: choice
        options: [live, prep]
      date:
        description: "対象日 YYYYMMDD（空なら今日）"
        required: false
permissions:
  contents: write
concurrency:
  group: boatrace
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r boatrace/requirements.txt
      - name: 予想データを作成
        env:
          BOATRACE_PASSWORD: ${{ secrets.BOATRACE_PASSWORD }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          DATE: ${{ inputs.date }}
        run: |
          case "$SCHEDULE" in
            "20 22 * * *") python -m boatrace.update prep ;;
            "10 9 * * *"|"40 12 * * *") python -m boatrace.update prep --tomorrow ;;
            "") python -m boatrace.update "${MODE:-live}" ${DATE:+--date "$DATE"} ;;
            *) python -m boatrace.update live ;;
          esac
      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/boatrace/data boatrace/state
          git diff --cached --quiet && exit 0
          git commit -q -m "ボートレース予想を更新 $(TZ=Asia/Tokyo date '+%m/%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1

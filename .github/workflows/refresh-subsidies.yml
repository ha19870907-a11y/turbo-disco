name: Refresh Subsidy Data

on:
  schedule:
    # 毎日 6:00 JST (前日21:00 UTC) に実行
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch subsidies from jGrants
        run: node scripts/fetch-subsidies.js

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/subsidy/data/subsidies.json
          if git diff --cached --quiet; then
            echo "変更なし(データに更新はありませんでした)"
          else
            git commit -m "補助金データを更新"
            git push
          fi

name: Collect Threads Insights

on:
  schedule:
    # 毎週月曜 6:00 JST (日曜21:00 UTC)
    - cron: "0 21 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Threads insights
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node scripts/fetch-thread-insights.js

      - name: Commit updated insights log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thread-insights.json thread-follower-history.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Threadsインサイトの記録を更新"
            git push
          fi

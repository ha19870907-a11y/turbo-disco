name: Daily Threads Post

on:
  schedule:
    # 8:00 JST (前日23:00 UTC)
    - cron: "0 23 * * *"
    # 13:00 JST (4:00 UTC)
    - cron: "0 4 * * *"
    # 20:00 JST (11:00 UTC)
    - cron: "0 11 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Post daily Threads content
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node scripts/post-daily-thread.js

name: Daily Threads Post

on:
  schedule:
    # 8:00 JST (前日23:00 UTC)
    - cron: "0 23 * * *"
    # 13:00 JST (4:00 UTC)
    - cron: "0 4 * * *"
    # 20:00 JST (11:00 UTC)
    - cron: "0 11 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine time slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 23 * * *") echo "slot=0" >> "$GITHUB_OUTPUT" ;;  # 8:00 JST
            "0 4 * * *") echo "slot=1" >> "$GITHUB_OUTPUT" ;;   # 13:00 JST
            "0 11 * * *") echo "slot=2" >> "$GITHUB_OUTPUT" ;;  # 20:00 JST
            *) echo "slot=0" >> "$GITHUB_OUTPUT" ;;             # 手動実行時など
          esac

      - name: Post daily Threads content
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: node scripts/post-daily-thread.js

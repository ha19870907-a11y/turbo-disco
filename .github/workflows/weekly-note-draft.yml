name: Weekly Note Draft

on:
  schedule:
    # 毎週月曜 朝9:00 JST (0:00 UTC) に実行
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate note draft
        run: node scripts/generate-note-draft.js

      - name: Commit and push draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add note-drafts/
          if git diff --cached --quiet; then
            echo "変更なし（今週分はすでに作成済みです）"
          else
            git commit -m "note下書きを自動生成"
            git push
          fi
